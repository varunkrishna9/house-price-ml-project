<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Price Prediction</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card"><h1>House Price Prediction</h1><p>Enter property details to estimate price.</p><form id="f"><label>Area (sq ft)<input name="Area" type="number" min="100" required></label><label>Bedrooms<input name="Bedrooms" type="number" min="1" required></label><label>Bathrooms<input name="Bathrooms" type="number" min="1" required></label><label>Age (years)<input name="Age" type="number" min="0" required></label><label>Location<select name="Location">{% for x in locations %}<option>{{x}}</option>{% endfor %}</select></label><label>Property Type<select name="Property_Type">{% for x in property_types %}<option>{{x}}</option>{% endfor %}</select></label><button>Predict Price</button></form><div id="r"></div></main><script>f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));["Area","Bedrooms","Bathrooms","Age"].forEach(k=>d[k]=Number(d[k]));r.textContent="Calculating...";try{let x=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}),j=await x.json();if(!x.ok)throw Error(j.error);r.textContent="Estimated price: ₹"+Number(j.predicted_price).toLocaleString("en-IN")}catch(x){r.textContent="Error: "+x.message}};</script></body></html>
